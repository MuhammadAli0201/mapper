<nz-drawer [nzVisible]="open()" [nzTitle]="title()" nzPlacement="right" [nzWidth]="800" (nzOnClose)="open.set(false)">
  <ng-container *nzDrawerContent>
    <div class="codes">
      @for (c of codes(); track c[0]) {
        <nz-tag>{{ c[0] }} &middot; {{ c[1] }}</nz-tag>
      }
    </div>
    <input nz-input placeholder="Search..." [ngModel]="search()" (ngModelChange)="search.set($event)" />
    <nz-table #tbl [nzData]="filtered()" [nzPageSize]="25" nzSize="small" class="tbl">
      <thead>
        <tr><th nzWidth="190px">Code</th><th nzWidth="150px">Cell(s)</th><th>Message</th></tr>
      </thead>
      <tbody>
        @for (i of tbl.data; track $index) {
          <tr><td>{{ i.code }}</td><td>{{ i.where }}</td><td>{{ i.message }}</td></tr>
        }
      </tbody>
    </nz-table>
  </ng-container>
</nz-drawer>
